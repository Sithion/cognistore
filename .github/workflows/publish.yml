name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/**'
      - 'pnpm-lock.yaml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Serialize publish runs per-branch. cancel-in-progress:false so a new push does
# NOT kill an in-flight run mid-upload (which would leave a half-uploaded
# release); the stuck-runner case is handled by timeout-minutes on publish-tauri.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Default-deny at the top level; every job that needs more declares it.
permissions:
  contents: read

jobs:
  # ── MCP Server → npm ──────────────────────────────────────────
  publish-mcp:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Strip workspace-only devDependencies from MCP package.json
        # pnpm v9 does not run npm lifecycle scripts (prepack/postpack/
        # prepublishOnly) during pack or publish, so the strip must be invoked
        # explicitly here. This removes @cognistore/sdk and @cognistore/shared
        # (bundled into dist/index.js by tsup, never published to npm) so
        # downstream `npm install` does not 404 on them.
        run: node apps/mcp-server/scripts/strip-workspace-deps.mjs

      - name: Validate MCP server tarball
        # Must run after `pnpm build` (dist/ must exist) and after the strip
        # step above. Catches the v2.0.0 publish regression where `workspace:*`
        # markers and references to private @cognistore/* packages leaked into
        # the npm tarball and made `npm install` fail with EUNSUPPORTEDPROTOCOL.
        run: |
          cd apps/mcp-server
          rm -rf /tmp/cog-validate
          pnpm pack --pack-destination /tmp/cog-validate
          TAR=$(ls /tmp/cog-validate/cognistore-mcp-server-*.tgz | head -1)
          if [ -z "$TAR" ]; then
            echo "::error::pnpm pack did not produce a tarball in /tmp/cog-validate"
            exit 1
          fi
          PKG=$(tar -xzOf "$TAR" package/package.json)
          if echo "$PKG" | grep -q '"workspace:'; then
            echo "::error::tarball contains 'workspace:' protocol reference"
            echo "$PKG"
            exit 1
          fi
          if echo "$PKG" | grep -Eq '"@cognistore/(sdk|shared|core|embeddings|providers)"'; then
            echo "::error::tarball references a private @cognistore/* package that is not published to npm"
            echo "$PKG"
            exit 1
          fi

      - name: Check if version exists
        id: version-check
        run: |
          PACKAGE_VERSION=$(node -p "require('./apps/mcp-server/package.json').version")
          if npm view @cognistore/mcp-server@$PACKAGE_VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Require npm >= 11.5.1 (trusted publishing)
        # npm authenticates through OIDC trusted publishing (configured on
        # npmjs.com for Sithion/cognistore + publish.yml): no NPM_TOKEN secret,
        # nothing to rotate. pnpm v9 hands the publish to the npm CLI, and only
        # npm >= 11.5.1 can do the OIDC exchange — fail loudly on an older one.
        if: steps.version-check.outputs.exists == 'false'
        run: |
          NPM_VERSION=$(npm --version)
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$NPM_VERSION" \
            || { echo "::error::npm $NPM_VERSION cannot use trusted publishing (needs >= 11.5.1)"; exit 1; }

      - name: Publish to npm
        if: steps.version-check.outputs.exists == 'false'
        run: cd apps/mcp-server && pnpm publish --provenance --access public --no-git-checks

      - name: Restore stripped package.json
        if: always()
        run: node apps/mcp-server/scripts/restore-workspace-deps.mjs

  # ── Create GitHub Release (single job to avoid race condition) ──
  create-release:
    needs: publish-mcp
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.pkg-version.outputs.version }}
      # "true" when this version is already a published (non-draft) release, so
      # downstream build/verify/promote jobs skip — a workflow-only change must
      # never rebuild (and momentarily delete the updater assets of) a shipped
      # release. A brand-new version or an incomplete draft still builds.
      published: ${{ steps.create.outputs.published }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Get version
        id: pkg-version
        run: echo "version=$(node -p "require('./apps/dashboard/package.json').version")" >> $GITHUB_OUTPUT

      - name: Create release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.pkg-version.outputs.version }}"
          TAG="v${VERSION}"

          # Check if release already exists. Use `gh release view` (not the
          # releases/tags API, which 404s on drafts) so both draft and published
          # releases are found.
          if gh release view "$TAG" &>/dev/null; then
            META=$(gh release view "$TAG" --json databaseId,isDraft)
            RELEASE_ID=$(echo "$META" | jq -r '.databaseId')
            if [ "$(echo "$META" | jq -r '.isDraft')" = "false" ]; then
              echo "Release $TAG is already published (id: $RELEASE_ID) — skipping rebuild."
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG exists as a draft (id: $RELEASE_ID) — will complete it."
            fi
          else
            RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
              -f tag_name="$TAG" \
              -f name="CogniStore $TAG" \
              -f body="## CogniStore $TAG

          Desktop app for managing your AI knowledge base with semantic search.
          Download the installer for your platform below.

          ### Downloads

          | Platform | File | Architecture |
          |----------|------|-------------|
          | macOS (Apple Silicon) | \`.dmg\` | arm64 (M1/M2/M3/M4) |
          | Linux | \`.AppImage\` | x86_64 |
          | Linux (Debian/Ubuntu) | \`.deb\` | x86_64 |

          ### macOS: \"App is damaged\" warning

          This app is not signed with an Apple Developer certificate, so macOS Gatekeeper blocks it on first open. This only affects the **initial install** — in-app updates thereafter need no workaround.

          **Easiest:** right-click (or Control-click) the app in **Applications** and choose **Open**, then confirm — or go to **System Settings > Privacy & Security** and click **Open Anyway**.

          **Or via Terminal** (removes the quarantine flag for this app only):
          \`\`\`bash
          xattr -dr com.apple.quarantine \"/Applications/CogniStore.app\"
          \`\`\`

          ### What's included

          - Setup wizard (auto-installs Ollama, creates SQLite database)
          - Dashboard with hybrid (semantic + keyword) search, stats, and knowledge health
          - MCP server configuration for Claude Code and GitHub Copilot
          - One-click uninstall (removes all data and configurations)" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')
            echo "Created draft release $TAG (id: $RELEASE_ID)"
          fi

          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Clean stale release assets
        # Runs ONCE here (before the publish-tauri matrix) instead of inside each
        # matrix job — otherwise concurrent jobs delete each other's updater
        # artifacts (a sibling Linux job would wipe the macOS .tar.gz/latest.json).
        # Skipped when the version is already published (nothing to rebuild).
        if: steps.create.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ steps.create.outputs.release_id }}"
          ASSETS=$(gh api repos/${{ github.repository }}/releases/${RELEASE_ID}/assets --jq '.[] | "\(.id) \(.name)"')
          echo "$ASSETS" | while read -r ASSET_ID ASSET_NAME; do
            [ -z "$ASSET_ID" ] && continue
            case "$ASSET_NAME" in
              *.tar.gz|*.tar.gz.sig|latest.json)
                echo "Deleting stale asset: $ASSET_NAME (id: $ASSET_ID)"
                gh api -X DELETE repos/${{ github.repository }}/releases/assets/${ASSET_ID}
                ;;
            esac
          done

  # ── Build web assets (runs once, platform-independent) ─────────
  build-web:
    needs: create-release
    if: needs.create-release.outputs.published != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build web assets
        working-directory: apps/dashboard
        run: node scripts/bundle-sidecar.mjs --phase=web

      - name: Upload sidecar web assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: sidecar-web
          retention-days: 1
          path: apps/dashboard/sidecar-bundle

  # ── Tauri Desktop App → GitHub Releases ────────────────────────
  publish-tauri:
    needs: [create-release, build-web]
    if: needs.create-release.outputs.published != 'true'
    strategy:
      fail-fast: false
      # Serialize the platform builds so tauri-action's read-merge-write of
      # latest.json accumulates every platform deterministically. Running them
      # concurrently races (last-writer-wins) and drops a platform entry.
      # macOS is Apple-Silicon-only: the Intel (macos-13) job never got a runner
      # (hung in "queued" -> 24h cancel every release) and no Intel .dmg ever
      # shipped, so x86_64-apple-darwin is intentionally dropped.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/dashboard/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Download web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sidecar-web
          path: apps/dashboard/sidecar-bundle

      - name: Bundle native modules
        working-directory: apps/dashboard
        run: node scripts/bundle-sidecar.mjs --phase=native

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/dashboard
          tagName: v${{ needs.create-release.outputs.version }}
          releaseName: 'CogniStore v${{ needs.create-release.outputs.version }}'
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true

  # NOTE: latest.json is automatically generated by tauri-action with updaterJsonKeepUniversal: true
  # The generate-updater job was removed in v0.9.0 as it was redundant and could cause overwrites.
  # updaterJsonKeepUniversal is inert now that macOS is single-arch (aarch64 only).

  # ── Verify the (still-draft) release is complete before it goes public ──
  verify-release:
    needs: [create-release, publish-tauri]
    if: needs.create-release.outputs.published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      # write (not read) because it reads a DRAFT release's assets, and draft
      # releases are only visible to a token with push access.
      contents: write
    steps:
      - name: Assert latest.json + updater assets are complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"
          VERSION="${{ needs.create-release.outputs.version }}"

          # Fetch THIS release's assets by id (not the /releases/latest/download
          # alias, which excludes drafts and can lag/point elsewhere).
          ASSETS_JSON=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" --paginate)
          NAMES=$(echo "$ASSETS_JSON" | jq -r '.[].name')
          echo "Assets on release:"; echo "$NAMES"

          require_asset() {
            echo "$NAMES" | grep -qx "$1" || { echo "::error::missing required asset: $1"; exit 1; }
          }
          require_asset "latest.json"
          require_asset "CogniStore_aarch64.app.tar.gz"
          require_asset "CogniStore_aarch64.app.tar.gz.sig"
          require_asset "CogniStore_${VERSION}_amd64.AppImage"
          require_asset "CogniStore_${VERSION}_amd64.AppImage.sig"
          require_asset "CogniStore_${VERSION}_amd64.deb"
          require_asset "CogniStore_${VERSION}_aarch64.dmg"

          # Download latest.json by asset id and assert version + platform entries.
          LATEST_ID=$(echo "$ASSETS_JSON" | jq -r '.[] | select(.name=="latest.json") | .id')
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/${LATEST_ID}" > latest.json
          echo "latest.json contents:"; cat latest.json

          jq -e --arg v "$VERSION" '.version == $v' latest.json >/dev/null \
            || { echo "::error::latest.json version != $VERSION"; exit 1; }
          for p in darwin-aarch64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].signature != "" and (.platforms[$p].url != "")' latest.json >/dev/null \
              || { echo "::error::latest.json missing/empty platform: $p"; exit 1; }
          done
          echo "verify-release: latest.json is complete for $VERSION (darwin-aarch64 + linux-x86_64)."

  # ── Promote the verified draft to a public release ──
  promote-release:
    needs: [create-release, verify-release]
    if: needs.create-release.outputs.published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the verified release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.create-release.outputs.version }}" \
            --repo ${{ github.repository }} --draft=false
          echo "Promoted v${{ needs.create-release.outputs.version }} to public (latest)."

  # ── Alert when a release run on main fails ──
  # A failed Publish notifies at most the person who merged, and a release left
  # as a draft is easy to miss. Keep one open issue and comment on it for each
  # failed run; close it by hand once a release goes through.
  alert-on-failure:
    needs: [publish-mcp, create-release, build-web, publish-tauri, verify-release, promote-release]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Publish workflow is failing on main"
          body="Publish run failed for ${GITHUB_SHA}: ${RUN_URL}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${title}\" in:title" --json number -q '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
