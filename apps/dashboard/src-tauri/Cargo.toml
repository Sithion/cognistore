[package]
name = "cognistore-dashboard"
version = "2.5.3"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "net", "io-util"] }
dirs = "6"
# Native OS keychains (macOS Keychain, Windows Credential Manager, Linux Secret
# Service). keyring 3.x makes backends opt-in; without these it uses a non-persistent
# mock store. crypto-rust avoids a system OpenSSL build dependency on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
getrandom = "0.3"
# Open the system browser for the OAuth 2.1 authorization redirect.
open = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
