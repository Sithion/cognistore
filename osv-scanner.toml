# OSV-Scanner ignore list (applied via --config in the osv-scan job of .github/workflows/ci.yml).
#
# Only advisories with NO available fix in our dependency tree are ignored, each
# with a rationale. Re-evaluate the entries below whenever dependencies are upgraded.

# ── npm: unfixable transitive deps ──

# GHSA-67mh-4wv8-2f99 — esbuild dev-server CORS bypass (CVSS 5.3)
# esbuild@0.18.20 is pinned by @esbuild-kit/core-utils@3.3.2 (latest published;
# no newer version fixes the esbuild pin). @esbuild-kit/core-utils is a transitive
# dep of @esbuild-kit/esm-loader, which drizzle-kit uses as a TS loader at build
# time. The vulnerability is in esbuild's built-in HTTP dev server; drizzle-kit
# uses esbuild as a compiler (no dev server is started). Not exploitable here.
[[IgnoredVulns]]
id = "GHSA-67mh-4wv8-2f99"

# GHSA-qwww-vcr4-c8h2 — React Router RSC Mode CSRF bypass (CVSS 7.1)
# 2026-10: the GitHub advisory now lists 7.18.2 as patched and we ship 7.18.5
# (override in package.json). Kept until OSV's record agrees; remove afterwards.
# Affects react-router >=7.12.0, fixed in 8.3.0. Not reachable by a version bump:
# react-router-dom's latest is 7.18.1 and pins react-router at 7.18.1 exactly, so
# 8.3.0 requires migrating off react-router-dom (v8 merged it into react-router)
# plus a react/react-dom bump to >=19.2.7. The advisory is specific to RSC mode —
# server actions executing before the CSRF check returns 400. The dashboard is a
# client-only SPA in a Tauri webview: it uses only the declarative router
# (BrowserRouter/Routes/Route/Link/useNavigate/useLocation/useSearchParams), with
# no createBrowserRouter, no RouterProvider, no data-router actions or loaders,
# and no RSC. Re-evaluate when react-router-dom ships a 7.x patch or the app
# migrates to react-router v8.
[[IgnoredVulns]]
id = "GHSA-qwww-vcr4-c8h2"

