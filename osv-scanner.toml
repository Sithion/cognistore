# OSV-Scanner ignore list (applied via --config in the osv-scan job of .github/workflows/ci.yml).
#
# Only advisories with NO available fix in our dependency tree are ignored, each
# with a rationale and a `reason` (printed by osv-scanner when it filters the
# finding). Re-evaluate the entries whenever dependencies are upgraded, and drop
# any that no longer match (run osv-scanner with an empty config to list them).

# ── npm ──

# GHSA-67mh-4wv8-2f99 — esbuild dev-server CORS bypass (CVSS 5.3)
# esbuild@0.18.20 is pinned by @esbuild-kit/core-utils@3.3.2 (latest published;
# no newer version fixes the esbuild pin). @esbuild-kit/core-utils is a transitive
# dep of @esbuild-kit/esm-loader, which drizzle-kit uses as a TS loader at build
# time. The vulnerability is in esbuild's built-in HTTP dev server; drizzle-kit
# uses esbuild as a compiler (no dev server is started). Not exploitable here.
[[IgnoredVulns]]
id = "GHSA-67mh-4wv8-2f99"
reason = "esbuild 0.18.20 pinned by @esbuild-kit/core-utils (latest) via drizzle-kit; the bug is in esbuild's dev server, which is never started (compiler use only)."

# ── Rust: no fixed version reachable in our tree ──
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370" # proc-macro-error — unmaintained, no fix; transitive via macro crates
reason = "Unmaintained, no patched version; build-time proc-macro dependency of transitive macro crates."
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429" # glib < 0.20 — pinned by Tauri 2.x GTK stack (glib 0.18); fix needs an upstream Tauri upgrade
reason = "glib 0.18 pinned by Tauri 2.x's GTK3 bindings; the 0.20 fix needs an upstream Tauri upgrade."

# quick-xml < 0.41.0 (RUSTSEC-2026-0194 / -0195, CVSS 7.5). quick-xml 0.38.4 is
# pulled by plist, whose requirement is `^0.38`; even the latest plist (1.9.0)
# only reaches quick-xml 0.39.4, so the 0.41.0 fix is unreachable until Tauri
# bumps its plist dependency. In our tree quick-xml is used solely by plist to
# parse local macOS `.plist` bundle/updater metadata (trusted files shipped in
# the app), not untrusted network input — so the XML-parsing issues are not
# reachable with attacker-controlled data here.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0194" # quick-xml < 0.41 — transitive via plist (Tauri); fix needs an upstream Tauri/plist upgrade
reason = "quick-xml 0.38 via plist (Tauri); 0.41 unreachable until Tauri bumps plist; only parses trusted local .plist files."
[[IgnoredVulns]]
id = "RUSTSEC-2026-0195" # quick-xml < 0.41 — transitive via plist (Tauri); fix needs an upstream Tauri/plist upgrade
reason = "Same path as RUSTSEC-2026-0194: quick-xml 0.38 via plist (Tauri), trusted local .plist input only."

# zvariant / zvariant_derive / zbus_names (RUSTSEC-2026-0370 / -0372 / -0371):
# "unmaintained" informational advisories, no patched version — the crates were
# folded into zbus 6. They come from zbus 4 via secret-service 4, pulled by
# keyring 3 (`sync-secret-service`, the Linux Secret Service backend for the
# external-provider secrets). Not a vulnerability; removal needs keyring 4 /
# zbus 6 (tracked in the v2.6 plan, item L.8).
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370" # zvariant — unmaintained (merged into zbus 6); via keyring 3 → secret-service 4 → zbus 4
reason = "Unmaintained (merged into zbus 6), no patched version; via keyring 3 -> secret-service 4 -> zbus 4. Removal tracked in v2.6 plan L.8 (keyring 4)."
[[IgnoredVulns]]
id = "RUSTSEC-2026-0371" # zbus_names — unmaintained (merged into zbus 6); same path
reason = "Unmaintained (merged into zbus 6), no patched version; same path as RUSTSEC-2026-0370."
[[IgnoredVulns]]
id = "RUSTSEC-2026-0372" # zvariant_derive — unmaintained (merged into zbus 6); same path
reason = "Unmaintained (merged into zbus 6), no patched version; same path as RUSTSEC-2026-0370."

# GHSA-qwgh-2vcv-g2f7 — block-buffer: a panic caught inside the caller's
# `compress`/`gen_block` callback can leave the buffer cursor corrupted (CVSS 6.3).
# Fixed only in block-buffer 0.12, which belongs to the digest 0.11 / RustCrypto
# 0.11 generation; ours is 0.10.4 via digest 0.10 (sha2, hmac), pulled by
# tauri-codegen (build time) and keyring 3 -> dbus-secret-service. Nothing here
# wraps hashing in catch_unwind, and the RustCrypto compress functions do not
# panic, so the corrupting sequence is unreachable. Re-evaluate when Tauri and
# keyring move to digest 0.11 (v2.6 plan L.8).
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer 0.10 via digest 0.10 (tauri-codegen, keyring); fix only in 0.12 (digest 0.11); requires a panic caught inside a hash compress callback, not reachable here."
